[package]
name = "native-ocr"
version = "0.2.0"
description = "Text recognition with the OCR engine built into the operating system: Windows.Media.Ocr on Windows, Vision on macOS and Tesseract on Linux"
readme = "README.md"
repository = "https://github.com/trypsynth/native-ocr"
keywords = ["ocr", "vision", "windows", "macos", "tesseract"]
categories = ["computer-vision", "accessibility", "api-bindings"]
license = "MIT"
edition = "2024"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Win32_Foundation", "Win32_System_Com", "Win32_System_WinRT"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFData"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColorSpace", "CGDataProvider", "CGImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSError", "NSString"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNObservation", "objc2-core-graphics"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.9.0"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(feature, values("cargo-clippy"))']

[lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
absolute_paths = "warn"
